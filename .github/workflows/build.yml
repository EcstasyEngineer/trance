name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build\vcpkg-bincache

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The windows-msvc preset's toolchainFile is literally
      # "$env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake", so VCPKG_ROOT must be set
      # before the preset can be used at all -- that is the whole reason build.bat
      # exists locally. The hosted runner ships vcpkg already bootstrapped at
      # VCPKG_INSTALLATION_ROOT, so point at that rather than cloning one.
      #
      # CMAKE is resolved from the Visual Studio install rather than PATH for the same
      # reason: the "Visual Studio 18 2026" generator is only known to a new enough
      # CMake, and an older cmake.exe on PATH fails to configure this project outright.
      # Taking VS's own bundled CMake makes the generator and the tool agree by
      # construction.
      - name: Resolve vcpkg + CMake from the Visual Studio install
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $cmake = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          if (-not (Test-Path $cmake)) { $cmake = (Get-Command cmake).Source }
          "CMAKE_EXE=$cmake" >> $env:GITHUB_ENV
          & $cmake --version

      # Cache the vcpkg BINARY cache, not build/. Caching build/ (as this workflow used
      # to) restores a CMakeCache.txt full of absolute paths from another runner, which
      # is worse than no cache. Keyed on the manifest: the port set only changes when
      # vcpkg.json does.
      - uses: actions/cache@v4
        with:
          path: build/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The preset pins the "Visual Studio 18 2026" generator, which is what
      # windows-latest (image windows-2025-vs2026) provides. Configuring with a
      # hand-written -G is what kept this workflow permanently red: it asked for
      # "Visual Studio 17 2022", which the runner does not have, and CMake failed with
      # "could not find any instance of Visual Studio" before reaching find_package.
      - name: Configure
        shell: pwsh
        run: |
          & $env:CMAKE_EXE --preset windows-msvc -DTRANCE_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          & $env:CMAKE_EXE --build --preset windows-release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-msvc -C Release --output-on-failure -LE gpu

      - uses: actions/upload-artifact@v4
        with:
          name: trance-windows-x64
          path: |
            build/windows-msvc/Release/trance.exe
            build/windows-msvc/Release/*.dll
